<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .brd { stroke: #30363d; stroke-width: 2; fill: none; rx: 8px; }
      .t-green { fill: #39d353; font-family: 'Courier New', Courier, monospace; font-size: 14px; }
      .t-white { fill: #c9d1d9; font-family: 'Courier New', Courier, monospace; font-size: 14px; }
      .t-gray { fill: #8b949e; font-family: 'Courier New', Courier, monospace; font-size: 14px; }
      .t-blue { fill: #58a6ff; font-family: 'Courier New', Courier, monospace; font-size: 14px; }
      .t-title { fill: #39d353; font-family: 'Courier New', Courier, monospace; font-size: 44px; font-weight: bold; }
      .bar-bg { fill: #30363d; rx: 3px; }
      .bar-fg { fill: #39d353; rx: 3px; }
      .ascii {
        fill: #39d353;
        font-family: 'Courier New', Courier, monospace;
        font-size: 11px;
        white-space: pre;
        animation: glitch-color 5s infinite;
      }
      .ascii-wrap {
        animation: float 4s ease-in-out infinite, glitch-skew 5s infinite;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes glitch-color {
        0%, 92% { fill: #39d353; }
        93% { fill: #ff003c; }
        94% { fill: #00e5ff; }
        95% { fill: #39d353; }
        96% { fill: #ff003c; }
        97%, 100% { fill: #39d353; }
      }
      @keyframes glitch-skew {
        0%, 92% { transform: skew(0deg) translate(0, 0); }
        93% { transform: skew(10deg) translate(-3px, 2px); }
        94% { transform: skew(-10deg) translate(3px, -2px); }
        95% { transform: skew(0deg) translate(0, 0); }
        96% { transform: skew(5deg) translate(2px, 2px); }
        97%, 100% { transform: skew(0deg) translate(0, 0); }
      }
    </style>
  </defs>

